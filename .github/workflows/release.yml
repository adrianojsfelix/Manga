# A tag "v0.9.0" builds the Windows installer and publishes it as a GitHub
# release; Manga finds it in Settings → About.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test
      - run: cargo test -p manga-core
      - run: npx tauri build
      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
