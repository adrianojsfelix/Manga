[package]
name = "manga"
version = "0.1.0"
description = "Manga: an island at the top of Windows"
edition = "2021"
license = "MIT"

[lib]
name = "manga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
manga-core = { path = "../crates/manga-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
