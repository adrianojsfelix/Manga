[package]
name = "manga"
version = "0.1.0"
description = "Manga: an island at the top of Windows"
edition = "2021"
license = "MIT"

[lib]
name = "manga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
manga-core = { path = "../crates/manga-core" }
# The chat's HTTP: native-tls (Windows' own TLS), no C to compile.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["process", "io-util"] }

[target.'cfg(windows)'.dependencies]
# API keys in Windows' Credential Manager.
keyring = { version = "3", features = ["windows-native"] }
# Windows' notification database is read through winsqlite3.dll, the SQLite
# that ships with Windows, loaded at run time (src/winsqlite.rs): nothing to compile.
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Devices_Radios",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
] }
